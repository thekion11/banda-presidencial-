# PARCHE PROPUESTO — NO ACTIVO. Para activarlo: copiar este archivo a .github/workflows/android-release.yml y crear los secretos del repositorio (ver docs/parches/LEEME.md).
# Exporta un AAB de release firmado con el keystore propio del dueño. Nunca imprime ni guarda las claves: se leen de secretos de GitHub.
# SIN VERIFICAR: no se pudo probar (necesita los secretos y una exportación con Gradle). Revisar cada paso al activarlo.
name: Android (release, manual)
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.2-stable"
      GODOT_TPL: "4.7.2.stable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verificar que existen los secretos (sin imprimirlos)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for v in KS KP KA; do if [ -z "${!v}" ]; then echo "Falta el secreto $v"; exit 1; fi; done
      - name: Instalar Godot y plantillas
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip && sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_TPL}
          unzip -q tpl.tpz -d tpl && cp -r tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_TPL}/
      - name: Plantilla de compilación de Android (Gradle)
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_TPL}/android_source.zip -d android/build
          echo "${GODOT_TPL}" > android/.build_version
      - name: Keystore de release desde los secretos
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Exportar AAB de release
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build
          python3 tools/check_version.py
          godot --headless --import --path . || true
          # requiere un preset «Android release» con gradle_build/use_gradle_build=true, gradle_build/export_format=1 (AAB) y package/signed=true (ver LEEME.md)
          godot --headless --path . --export-release "Android release" build/presidente-release.aab
      - name: Auditar el manifiesto (informativo)
        continue-on-error: true
        run: |
          unzip -q -o build/presidente-release.aab 'base/manifest/AndroidManifest.xml' -d /tmp/aab || true
          ls -l build/presidente-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: presidente-release-aab
          retention-days: 7
          if-no-files-found: error
          path: build/presidente-release.aab
      - name: Borrar el keystore del ejecutor
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
