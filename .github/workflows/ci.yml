name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 20 + la regresión visual (3 tamaños de ventana, unos 4 min)
    env:
      GODOT_VERSION: "4.7.2-stable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar datos y límites
        run: |
          pip install jsonschema
          python3 tools/validate_data.py
          python3 tools/check_limits.py
          python3 tools/check_constantes.py
          python3 tools/validate_tipos.py
          python3 tools/check_presupuesto.py
          python3 tools/validar_textos.py
          python3 tools/check_entradas.py
          python3 tools/check_version.py
          python3 tools/generar_api.py --verificar
          python3 tools/test_validate.py
          python3 tools/validar_metro.py --verificar
          python3 tools/informe_alcanzabilidad.py
      - name: Instalar Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
      - name: Importar proyecto
        run: |
          godot --headless --import --path . 2>&1 | tee import.log || true
          if grep -q "SCRIPT ERROR" import.log; then echo "El import tiene errores de script"; exit 1; fi
      - name: "Todas las pruebas (tests/test_*.gd: oro, balance, instantánea, rendimiento y humo de UI)"
        run: |
          # se recorren todas, no una lista a mano: una prueba nueva entra sola al CI (hallazgo de «Búsqueda infinita de fallas»: 10 de 41 no se ejecutaban)
          for f in tests/test_*.gd; do
            t=$(basename "$f" .gd)
            echo "== $t"
            # una prueba que no compila sale con código 0: se guarda la salida y se falla ante errores de script o si se cuelga (300 s)
            XDG_DATA_HOME="$(mktemp -d)" timeout 300 godot --headless --path . -s "$f" 2>&1 | tee "/tmp/$t.log"
            [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "FALLO: $t"; exit 1; }
            if grep -qE "SCRIPT ERROR|Parse Error|Could not find type" "/tmp/$t.log"; then echo "FALLO: $t tiene errores de script"; exit 1; fi
          done
      - name: "Estado del proyecto (no bloqueante)"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/estado_proyecto.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estado-actual
          retention-days: 14
          if-no-files-found: ignore
          path: docs/ESTADO_ACTUAL.md
      - name: Fuzzing del núcleo (acciones aleatorias e inválidas, replay idéntico)
        run: godot --headless --path . -s tests/fuzz_acciones.gd -- 60 7000
      - name: "Fuzzing de carrera, instantáneas, propiedades, flujo de la interfaz, Congreso, calendario, guardado, obras y coalición (acotado)"
        run: |
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_carrera.gd -- 4 700
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_instantanea.gd -- 100 31
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_propiedades.gd -- 1 800
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_flujo_ui.gd -- 9 2100
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_congreso.gd -- 1500 12
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_calendario.gd -- 12 1500
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_guardado.gd -- 300 77
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_obras.gd -- 6 2600
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_coalicion.gd -- 5 1700
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_ultima_config.gd -- 300 5
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_semillas_extremas.gd
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_mono.gd -- 500 4100
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_toque_real.gd -- 60 9100
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_plan_cartas.gd -- 10 6100 60
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_zoom_mapa.gd -- 100 9500
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_voto_regional.gd -- 300 16 8800
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_ahorro.gd -- 8 7700 60
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_tablero_gabinete.gd -- 2 30 3300
          XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . -s tests/fuzz_agenda.gd -- 9 5500 60
      - name: "Regresión visual con ventana real (no bloqueante; guía en docs/CONTRIBUIR.md)"
        continue-on-error: true
        run: |
          pip install pillow > /dev/null
          command -v xvfb-run > /dev/null || sudo apt-get install -y xvfb > /dev/null
          python3 tools/regresion_visual.py | tee regresion_visual.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regresion-visual
          retention-days: 14
          if-no-files-found: ignore
          path: |
            regresion_visual.md
            /tmp/regresion_visual/diferencias
