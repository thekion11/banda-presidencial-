name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.7.2-stable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar datos y límites
        run: |
          pip install jsonschema
          python3 tools/validate_data.py
          python3 tools/check_limits.py
          python3 tools/validar_metro.py --verificar
          python3 tools/informe_alcanzabilidad.py
      - name: Instalar Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
      - name: Importar proyecto
        run: |
          godot --headless --import --path . 2>&1 | tee import.log || true
          if grep -q "SCRIPT ERROR" import.log; then echo "El import tiene errores de script"; exit 1; fi
      - name: "Todas las pruebas (tests/test_*.gd: oro, balance, instantánea, rendimiento y humo de UI)"
        run: |
          # se recorren todas, no una lista a mano: una prueba nueva entra sola al CI (hallazgo de «Búsqueda infinita de fallas»: 10 de 41 no se ejecutaban)
          for f in tests/test_*.gd; do
            t=$(basename "$f" .gd)
            echo "== $t"
            godot --headless --path . -s "$f"
          done
      - name: Fuzzing del núcleo (acciones aleatorias e inválidas, replay idéntico)
        run: godot --headless --path . -s tests/fuzz_acciones.gd -- 60 7000
