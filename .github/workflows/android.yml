name: Android (debug)
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: "4.3-stable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar Godot y plantillas
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip && sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q tpl.tpz -d tpl && cp -r tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Android SDK y keystore de depuración
        run: |
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          godot --headless --import --path . || true
          cat >> ~/.config/godot/editor_settings-4.3.tres <<EOF2
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF2
      - name: Exportar APK de depuración
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/presidente-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: presidente-debug-apk
          path: build/presidente-debug.apk
